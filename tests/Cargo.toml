[package]
name = "certify-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Shared test harness (PDA derivation, instruction encoders, account decoders,
# LiteSVM/Mollusk setup). Integration test files live in `tests/` and pull this in.
[lib]
name = "certify_tests"
path = "src/lib.rs"

[dependencies]
# The program under test — only its `layout`/`errors`/`state`/`constants` consts are
# used from the host; execution happens against the compiled `.so`.
certify = { path = "../programs/certify" }

litesvm = { workspace = true }
mollusk-svm = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
solana-instruction = { workspace = true }
solana-account = { workspace = true }
solana-clock = { workspace = true }
solana-pubkey = { workspace = true }
solana-sdk-ids = { workspace = true }
serde_json = "1"
